name: Docker Learning Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-phase-2:
    name: Test Phase 2 API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: phase-2/requirements-dev.txt

      - name: Install development dependencies
        working-directory: phase-2
        run: python -m pip install -r requirements-dev.txt

      - name: Run API tests
        working-directory: phase-2
        run: python -m pytest -v

  build-docker-images:
    name: Build Phase 1 and Phase 2 images
    runs-on: ubuntu-latest
    needs: test-phase-2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Phase 1 image
        uses: docker/build-push-action@v6
        with:
          context: ./phase-1
          file: ./phase-1/Dockerfile
          tags: docker-mastery:phase1
          push: false

      - name: Build Phase 2 image
        uses: docker/build-push-action@v6
        with:
          context: ./phase-2
          file: ./phase-2/Dockerfile
          tags: docker-mastery:phase2
          push: false
